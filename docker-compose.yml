version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: report-generator
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ORG_NAME=Prefeitura Municipal de Recife
      - NEXT_PUBLIC_SHOW_WATERMARK=true
      - WATERMARK_TEXT=CONFIDENCIAL
      - WATERMARK_COLOR=C0C0C0
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/generate-pdf']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Opcional: para desenvolvimento com hot-reload
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: report-generator-dev
    command: npm run dev
    ports:
      - '3001:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_ORG_NAME=Dev - Gerador de Relatórios
      - NEXT_PUBLIC_SHOW_WATERMARK=true
      - WATERMARK_TEXT=RASCUNHO
    profiles:
      - dev
